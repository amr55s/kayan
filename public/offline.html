<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>أنت غير متصل — KAYAN CITY SPOT</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#fafafa;color:#09090b;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,440px);padding:28px;border:1px solid #e4e4e7;border-radius:28px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(9,9,11,.08)}.icon{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:20px;background:#09090b;color:#fff;font-size:28px}h1{margin:20px 0 8px;font-size:24px}p{margin:0;color:#71717a;line-height:1.9}button{width:100%;min-height:48px;margin-top:22px;border:0;border-radius:14px;background:#09090b;color:#fff;font:700 15px inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">↻</div>
      <h1>الاتصال بالإنترنت متوقف</h1>
      <p>تحقق من الشبكة ثم أعد المحاولة. الصفحات التي فتحتها سابقًا قد تظل متاحة من التطبيق.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
