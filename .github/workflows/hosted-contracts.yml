name: Hosted contracts

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

concurrency:
  group: hosted-contracts-${{ github.workflow }}-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-availability:
    name: Hosted contract availability
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.detect.outputs.supabase }}
      storage: ${{ steps.detect.outputs.storage }}
      preview: ${{ steps.detect.outputs.preview }}
    env:
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_CI_BRANCH_DB_URL != '' }}
      HAS_SUPABASE_BRANCH_REF: ${{ secrets.SUPABASE_CI_BRANCH_REF != '' }}
      HAS_SUPABASE_PRODUCTION_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF != '' }}
      HAS_SUPABASE_GUARD: ${{ secrets.SUPABASE_CI_BRANCH_GUARD != '' }}
      HAS_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT != '' || secrets.DO_SPACES_ENDPOINT != '' }}
      HAS_STORAGE_PRIVATE_BUCKET: ${{ secrets.OBJECT_STORAGE_PRIVATE_BUCKET != '' || secrets.OBJECT_STORAGE_BUCKET != '' || secrets.DO_SPACES_BUCKET != '' }}
      HAS_STORAGE_PUBLIC_BUCKET: ${{ secrets.OBJECT_STORAGE_PUBLIC_BUCKET != '' || secrets.OBJECT_STORAGE_BUCKET != '' || secrets.DO_SPACES_BUCKET != '' }}
      HAS_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION != '' || secrets.DO_SPACES_REGION != '' }}
      HAS_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID != '' || secrets.DO_SPACES_ACCESS_KEY_ID != '' }}
      HAS_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY != '' || secrets.DO_SPACES_SECRET_ACCESS_KEY != '' }}
    steps:
      - id: detect
        name: Report conditional contracts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          supabase=false
          storage=false
          preview=false
          if [[ "$EVENT_NAME" != "deployment_status" ]] \
            && [[ "$HAS_SUPABASE_DB_URL" == "true" ]] \
            && [[ "$HAS_SUPABASE_BRANCH_REF" == "true" ]] \
            && [[ "$HAS_SUPABASE_PRODUCTION_REF" == "true" ]] \
            && [[ "$HAS_SUPABASE_GUARD" == "true" ]]; then supabase=true; fi
          if [[ "$EVENT_NAME" != "deployment_status" ]] \
            && [[ "$HAS_STORAGE_ENDPOINT" == "true" ]] \
            && [[ "$HAS_STORAGE_PRIVATE_BUCKET" == "true" ]] \
            && [[ "$HAS_STORAGE_PUBLIC_BUCKET" == "true" ]] \
            && [[ "$HAS_STORAGE_REGION" == "true" ]] \
            && [[ "$HAS_STORAGE_ACCESS_KEY" == "true" ]] \
            && [[ "$HAS_STORAGE_SECRET_KEY" == "true" ]]; then storage=true; fi
          if [[ "$EVENT_NAME" == "deployment_status" ]] \
            && [[ "$DEPLOYMENT_STATE" == "success" ]] \
            && [[ "$DEPLOYMENT_ENVIRONMENT" == *"Preview"* ]] \
            && [[ "$DEPLOYMENT_URL" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then preview=true; fi
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          {
            echo '## Hosted CI contracts'
            echo "- Supabase disposable branch: $([[ "$supabase" == true ]] && echo READY || echo SKIPPED — required secrets unavailable or event not applicable)"
            echo "- S3-compatible object storage prefix smoke: $([[ "$storage" == true ]] && echo READY || echo SKIPPED — required secrets unavailable or event not applicable)"
            echo "- Vercel Preview browser gates: $([[ "$preview" == true ]] && echo READY || echo SKIPPED — not a successful public vercel.app Preview event)"
          } >> "$GITHUB_STEP_SUMMARY"

  supabase-hosted:
    name: Supabase branch migration, RLS, and types
    needs: contract-availability
    if: needs.contract-availability.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CI_BRANCH_DB_URL: ${{ secrets.SUPABASE_CI_BRANCH_DB_URL }}
      SUPABASE_CI_BRANCH_REF: ${{ secrets.SUPABASE_CI_BRANCH_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_CI_BRANCH_GUARD: ${{ secrets.SUPABASE_CI_BRANCH_GUARD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch, pinned
        with:
          version: 2.115.0
      - run: npm ci
      - name: Refuse production database targets
        run: node scripts/validate-supabase-ci-target.mjs
      - name: Apply the complete migration chain to the disposable branch
        run: supabase db push --db-url "$SUPABASE_CI_BRANCH_DB_URL" --include-all
      - name: Run hosted RLS and privilege tests
        run: supabase test db --db-url "$SUPABASE_CI_BRANCH_DB_URL"
      - name: Reject generated database type drift
        shell: bash
        run: |
          supabase gen types typescript --db-url "$SUPABASE_CI_BRANCH_DB_URL" > /tmp/database.types.ts
          diff --unified lib/supabase/database.types.ts /tmp/database.types.ts

  storage-prefix-smoke:
    name: Object storage exact-prefix smoke
    needs: contract-availability
    if: needs.contract-availability.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_PRIVATE_BUCKET: ${{ secrets.OBJECT_STORAGE_PRIVATE_BUCKET }}
      OBJECT_STORAGE_PUBLIC_BUCKET: ${{ secrets.OBJECT_STORAGE_PUBLIC_BUCKET }}
      OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
      DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
      DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
      DO_SPACES_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      DO_SPACES_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      CI_RUN_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:storage

  preview-e2e:
    name: Vercel Preview Playwright and axe
    needs: contract-availability
    if: needs.contract-availability.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:preview
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-playwright-${{ github.event.deployment.id }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7

  preview-lighthouse:
    name: Vercel Preview Lighthouse budgets
    needs: contract-availability
    if: needs.contract-availability.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}/marketplace
            ${{ github.event.deployment_status.target_url }}/signin
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
